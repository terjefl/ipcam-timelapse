# Mal for compose. Terjes prod-kopi ligger i Docker-repoet (DOCKERSRV1/ipcam-timelapse/compose.yml).
services:
  iptimelapse:
    image: ghcr.io/terjefl/ipcam-timelapse:latest
    container_name: iptimelapse
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo
    ports:
      - "8080:8080"
    volumes:
      - /path/to/config.yaml:/app/config.yaml:ro
      - /path/to/images:/images
      - /path/to/logs:/app/logs
