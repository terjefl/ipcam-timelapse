name: sjekk og image

# Syntaks- og importsjekk kjører før image-bygget, så et ødelagt image ikke publiseres.
# På pull requests og andre grener kjøres bare sjekken; :latest kommer kun fra main.

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'deploy/**']
  pull_request:
  workflow_dispatch:

jobs:
  sjekk:
    name: syntaks og import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: installer
        run: pip install -r requirements.txt
      - name: kompiler og importer
        run: |
          python -m py_compile timelapse.py
          python -c "import timelapse"

  bygg:
    needs: sjekk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: logg inn på ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: bygg og push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
